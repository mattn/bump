name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOARCH=amd64 GOOS=linux go build -o bump_linux_amd64 .
          GOARCH=arm64 GOOS=linux go build -o bump_linux_arm64 .
          GOARCH=amd64 GOOS=darwin go build -o bump_darwin_amd64 .
          GOARCH=arm64 GOOS=darwin go build -o bump_darwin_arm64 .
          GOARCH=amd64 GOOS=windows go build -o bump_windows_amd64.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bump_linux_amd64
            bump_linux_arm64
            bump_darwin_amd64
            bump_darwin_arm64
            bump_windows_amd64.exe
